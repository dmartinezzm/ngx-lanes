name: Publish to npm

# Se lanza al crear una release en GitHub con una etiqueta como v0.1.0, o a mano desde
# Actions → Publish to npm → Run workflow (para reintentar una release que falló).
# Publica con "trusted publishing" de npm: sin tokens. Cada paquete debe tener configurado en
# npmjs.com (Settings → Trusted publishing) este repo y el archivo release.yml, con permiso
# "npm stage publish". Después hay que aprobar cada versión en npmjs.com → Staged Packages.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v0.1.0
        required: true

permissions:
  contents: read
  id-token: write # trusted publishing y --provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing necesita npm 11.5.1 o posterior.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm ng test lanes --watch=false
      - run: pnpm ng test probe --watch=false
      - run: pnpm ng build lanes
      - run: pnpm ng build probe
      - name: Check versions match the tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          TAG="${RELEASE_TAG#v}"
          for pkg in dist/lanes dist/probe; do
            V=$(node -p "require('./$pkg/package.json').version")
            if [ "$V" != "$TAG" ]; then echo "$pkg is $V but the tag is $TAG"; exit 1; fi
          done
      # Publicación por fases: el paquete queda en npmjs.com → Staged Packages hasta que lo
      # apruebes con tu código 2FA. Es lo que permite el trusted publisher ("npm stage publish").
      - run: npm stage publish --provenance --access public
        working-directory: dist/lanes
      - run: npm stage publish --provenance --access public
        working-directory: dist/probe
