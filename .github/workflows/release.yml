name: Publish to npm

# Se lanza al crear una release en GitHub con una etiqueta como v0.1.0.
# Requiere el secreto NPM_TOKEN (token "Automation" o "Granular" con permiso de publicación).
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # para --provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm ng test lanes --watch=false
      - run: pnpm ng test probe --watch=false
      - run: pnpm ng build lanes
      - run: pnpm ng build probe
      - name: Check versions match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for pkg in dist/lanes dist/probe; do
            V=$(node -p "require('./$pkg/package.json').version")
            if [ "$V" != "$TAG" ]; then echo "$pkg is $V but the tag is $TAG"; exit 1; fi
          done
      - run: npm publish dist/lanes --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish dist/probe --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
