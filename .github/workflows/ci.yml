name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ng test lanes --watch=false
      - run: pnpm ng test probe --watch=false
      - run: pnpm ng build lanes
      - run: pnpm ng build probe
      - run: pnpm ng build demo
