name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ng build lanes
      - run: pnpm ng build probe
      # Modo desarrollo a propósito: Probe es una herramienta de desarrollo y así los orígenes de las
      # fugas se leen con su nombre real (_BuggyPage.ngOnInit) en vez de nombres minificados.
      - run: pnpm ng build demo --configuration development --base-href /${{ github.event.repository.name }}/
      # GitHub Pages no conoce las rutas de Angular: una copia de index.html por ruta para que respondan 200,
      # y 404.html como comodín para cualquier otra.
      - name: Copy index.html for each route
        run: |
          cd dist/demo/browser
          cp index.html 404.html
          for route in pro errors; do mkdir -p "$route" && cp index.html "$route/index.html"; done
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/demo/browser
      - id: deployment
        uses: actions/deploy-pages@v5
